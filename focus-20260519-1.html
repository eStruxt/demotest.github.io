<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Telegram Desktop clipboard test</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body { font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; padding: 16px; white-space: pre-wrap; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  .ok { color: #8a1f11; }
  .blk { color: #0f5f2f; }
  .muted { color: #555; }
</style>
</head>
<body tabindex="-1">
<h1>Telegram Desktop clipboard test</h1>
<div id="out" class="muted">Waiting for Telegram Desktop WebView focus...</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const out = document.getElementById("out");
const tg = window.Telegram && window.Telegram.WebApp;
let done = false;
let attempts = 0;

if (tg) {
  try {
    tg.ready();
    tg.expand();
  } catch (_) {}
}

try {
  window.focus();
  document.body.focus();
} catch (_) {}

function metadata() {
  return {
    build: "focus-20260519-1",
    platform: (tg && tg.platform) || "n/a",
    version:  (tg && tg.version)  || "n/a",
    isSecureContext: isSecureContext,
    hasFocus: document.hasFocus(),
    visibilityState: document.visibilityState,
    userAgent: navigator.userAgent,
    time: new Date().toISOString()
  };
}

function schedule(delay) {
  if (!done) {
    setTimeout(runTest, delay);
  }
}

async function runTest() {
  if (done) {
    return;
  }

  attempts += 1;
  const meta = metadata();
  out.className = "muted";
  out.innerText =
    "Running test automatically...\n\n" +
    JSON.stringify({ build: meta.build, attempts, focus: meta.hasFocus, visibility: meta.visibilityState }, null, 2);

  if (!document.hasFocus() && attempts < 300) {
    schedule(100);
    return;
  }

  try {
    const t = await navigator.clipboard.readText();
    const preview = t.slice(0, 240);
    done = true;
    out.className = "ok";
    out.innerText =
      "Result: clipboard value returned by navigator.clipboard.readText()\n\n" +
      "length: " + t.length + " chars\n" +
      "preview:\n" + preview + "\n\n" +
      JSON.stringify(meta, null, 2);

    if (tg && typeof tg.showAlert === "function") {
      tg.showAlert(
        "Clipboard test result\n\n" +
        "length: " + t.length + " chars\n\n" +
        preview
      );
    }
  } catch (e) {
    if (String(e && e.message || "").includes("Document is not focused") && attempts < 300) {
      schedule(100);
      return;
    }

    done = true;
    out.className = "blk";
    out.innerText =
      "The platform did not return clipboard text: " + e.name + ": " + e.message + "\n\n" +
      JSON.stringify(meta, null, 2);
    if (tg && typeof tg.showAlert === "function") {
      tg.showAlert("Clipboard test did not return text: " + e.name + ": " + e.message);
    }
  }
}

window.addEventListener("focus", () => schedule(0));
document.addEventListener("visibilitychange", () => schedule(0));
requestAnimationFrame(() => schedule(0));
schedule(50);
</script>
</body>
</html>
